name: CI

# TDD docs-site D7: every pull request and every push to main proves the pin,
# the code, the build, and the built site in three engines. Vercel builds the
# preview and production deployments; this workflow is the gate in front of them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  pin:
    name: Pinned ui-platform provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Digests against the pin, then SLSA provenance: signed by ui-platform's
      # CI workflow and built from the pinned commit on main.
      - name: Verify the vendored tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ui-platform.mjs verify

  check:
    name: Format, lint, types, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck

  # The browser jobs run in Playwright's own image, which carries the browsers and the
  # system libraries they need: nothing is downloaded or installed with apt per run (a
  # slow Ubuntu mirror once held the old install step for 15 minutes). Its tag must
  # follow the `playwright` version in package.json; each job checks that first.
  # Every engine and the ruler check run side by side.
  smoke:
    name: Smoke test (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The image matches Playwright
        run: sh scripts/playwright-image.sh 1.63.0
      - run: pnpm build
      # Every route, light and dark: no page error, no console error, no CSP
      # violation, a nonce on every response, nothing wider than 1440px or 390px.
      - name: Smoke test
        timeout-minutes: 10
        run: node scripts/smoke.mjs --browsers ${{ matrix.browser }} --shots artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: always() && matrix.browser == 'chromium'
        with:
          name: screenshots
          path: artifacts/screenshots
          retention-days: 14

  ruler:
    name: Ruler check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The image matches Playwright
        run: sh scripts/playwright-image.sh 1.63.0
      - run: pnpm build
      # TDD docs-site D15: the ruler's titles never cross, every letter is drawn, and the
      # section bars, the nav readout, the ruler, and the contents agree on here.
      - name: Ruler check
        timeout-minutes: 15
        run: node scripts/ruler-check.mjs

  # The check branch protection knows by this name: green only when every engine's smoke
  # test and the ruler check are.
  site:
    name: Build and browser smoke test
    needs: [smoke, ruler]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every browser job passed
        run: |
          test "${{ needs.smoke.result }}" = success
          test "${{ needs.ruler.result }}" = success

  governance:
    name: Central governance linter
    uses: anshacerbia2/scnehaux-architecture/.github/workflows/linter.yml@main
    with:
      target_dir: docs/designs
      governance_ref: main
